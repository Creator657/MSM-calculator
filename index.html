<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSM Treat Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator" role="application" aria-labelledby="appTitle">
    <div class="header">
        <div class="brand-dot" aria-hidden="true"></div>
        <h2 id="appTitle">MSM Treat Calc</h2>

        <!-- Visible theme dropdown -->
        <div class="theme-select" style="margin-left:auto;">
          <label for="themeSelect" class="small">Theme</label>
          <select id="themeSelect" aria-label="Theme selector">
            <option value="default">Default</option>
            <option value="plant-island">Plant Island</option>
            <option value="cold-island">Cold Island</option>
            <option value="air-island">Air Island</option>
            <option value="water-island">Water Island</option>
            <option value="earth-island">Earth Island</option>
            <option value="fire-haven">Fire Haven</option>
            <option value="fire-oasis">Fire Oasis</option>
            <option value="light-island">Light Island</option>
            <option value="psychic-island">Psychic Island</option>
            <option value="faerie-island">Faerie Island</option>
            <option value="bone-island">Bone Island</option>
            <option value="magical-sanctum">Magical Sanctum</option>
            <option value="wublin-island">Wublin Island</option>
            <option value="ethereal-island">Ethereal Island</option>
            <option value="plasma-islet">Plasma Islet</option>
            <option value="mech-islet">Mech Islet</option>
            <option value="shadow-islet">Shadow Islet</option>
            <option value="crystal-islet">Crystal Islet</option>
          </select>
        </div>

    </div>
    
    <div class="input-group">
        <label for="foodX">Food per Click (X)</label>
        <input type="number" id="foodX" value="22" min="0" aria-describedby="foodXHelp">
        <div class="small" id="foodXHelp">Amount of food gained per single click.</div>
    </div>

    <!-- Current level slider (1-19) -->
    <div class="input-group">
        <label for="currentLevel">Current Level (1–19)</label>
        <div class="range-container">
            <input type="range" id="currentLevel" min="1" max="19" value="1" aria-valuemin="1" aria-valuemax="19" aria-valuenow="1">
            <span id="currentValue">1</span>
        </div>
        <div class="small">The level the pet is currently at.</div>
    </div>

    <!-- Target level slider (2-20) -->
    <div class="input-group">
        <label for="targetLevel">Target Level (2–20)</label>
        <div class="range-container">
            <input type="range" id="targetLevel" min="2" max="20" value="2" aria-valuemin="2" aria-valuemax="20" aria-valuenow="2">
            <span id="targetValue">2</span>
        </div>
        <div class="small">Desired level (must be at least 1 higher than Current Level).</div>
    </div>

    <div class="input-group">
        <label for="clicksFed">Clicks Fed Already on Current Level (0–3)</label>
        <div class="range-container">
            <input type="range" id="clicksFed" min="0" max="3" value="0" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0">
            <span id="clicksValue">0</span>
        </div>
    </div>

    <button id="calculateBtn">Calculate Total</button>

    <div class="result" id="resultDisplay" role="status" aria-live="polite">
        <span class="label">Total Treats:</span>
        <span class="value" id="resultValue">4,685,736</span>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
