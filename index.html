<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSM Treat Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator" role="application" aria-labelledby="appTitle">
    <div class="header">
        <div class="brand-dot" aria-hidden="true"></div>
        <h2 id="appTitle">MSM Treat Calc</h2>
        <div class="theme-picker" aria-hidden="false">
          <select id="themeSelect" class="sr-only" aria-label="Theme selector (fallback)">
            <option value="default">Default</option>
            <option value="plant-island">Plant Island</option>
            <option value="cold-island">Cold Island</option>
            <option value="air-island">Air Island</option>
            <option value="water-island">Water Island</option>
            <option value="earth-island">Earth Island</option>
            <option value="fire-haven">Fire Haven</option>
            <option value="fire-oasis">Fire Oasis</option>
            <option value="light-island">Light Island</option>
            <option value="psychic-island">Psychic Island</option>
            <option value="faerie-island">Faerie Island</option>
            <option value="bone-island">Bone Island</option>
            <option value="magical-sanctum">Magical Sanctum</option>
            <option value="wublin-island">Wublin Island</option>
            <option value="ethereal-island">Ethereal Island</option>
            <option value="plasma-islet">Plasma Islet</option>
            <option value="mech-islet">Mech Islet</option>
            <option value="shadow-islet">Shadow Islet</option>
            <option value="crystal-islet">Crystal Islet</option>
          </select>

          <button class="current-theme-btn" id="currentThemeBtn" aria-haspopup="true" aria-expanded="false" aria-label="Choose theme">
            <span class="current-swatch" id="currentSwatch"></span>
            <span class="current-theme-label" id="currentLabel">Default</span>
          </button>

          <div class="theme-grid" id="themeGrid" role="menu" aria-hidden="true">
            <!-- Each theme-item has data-theme and an inline swatch colors for preview -->
            <button class="theme-item" data-theme="default" role="menuitem">
              <span class="swatch" style="background:linear-gradient(90deg,#0f1724,#122033);"></span>
              <span class="tname">Default</span>
            </button>
            <button class="theme-item" data-theme="plant-island" role="menuitem">
              <span class="swatch" style="background:linear-gradient(90deg,#7dd77d,#5aa85a);"></span>
              <span class="tname">Plant Island</span>
            </button>
            <button class="theme-item" data-theme="cold-island" role="menuitem">
              <span class="swatch" style="background:linear-gradient(90deg,#8ec6ff,#bfe8ff);"></span>
              <span class="tname">Cold Island</span>
            </button>
            <button class="theme-item" data-theme="air-island" role="menuitem">
              <span class="swatch" style="background:linear-gradient(90deg,#bfe7ff,#f1e6d6);"></span>
              <span class="tname">Air Island</span>
            </button>
            <button class="theme-item" data-theme="water-island" role="menuitem">
              <span class="swatch" style="background:linear-gradient(90deg,#3dd1c9,#6b8cff);"></span>
              <span class="tname">Water Island</span>
            </button>
            <button class="theme-item" data-theme="earth-island" role="menuitem">
              <span class="swatch" style="background:linear-gradient(90deg,#d9903e,#b86a2b);"></span>
              <span class="tname">Earth Island</span>
            </button>
            <button class="theme-item" data-theme="fire-haven" role="menuitem">
              <span class="swatch" style="background:linear-gradient(90deg,#ff7043,#ffb86b);"></span>
              <span class="tname">Fire Haven</span>
            </button>
            <button class="theme-item" data-theme="fire-oasis" role="menuitem">
              <span class="swatch" style="background:linear-gradient(90deg,#ff7a59,#ffb199);"></span>
              <span class="tname">Fire Oasis</span>
            </button>
            <button class="theme-item" data-theme="light-island" role="menuitem">
              <span class="swatch" style="background:linear-gradient(90deg,#ffd27a,#ffc4a3);"></span>
              <span class="tname">Light Island</span>
            </button>
            <button class="theme-item" data-theme="psychic-island" role="menuitem">
              <span class="swatch" style="background:linear-gradient(90deg,#d25bd9,#ff78d1);"></span>
              <span class="tname">Psychic Island</span>
            </button>
            <button class="theme-item" data-theme="faerie-island" role="menuitem">
              <span class="swatch" style="background:linear-gradient(90deg,#ff77c2,#bcd78f);"></span>
              <span class="tname">Faerie Island</span>
            </button>
            <button class="theme-item" data-theme="bone-island" role="menuitem">
              <span class="swatch" style="background:linear-gradient(90deg,#c9b99a,#8b7b6e);"></span>
              <span class="tname">Bone Island</span>
            </button>
            <button class="theme-item" data-theme="magical-sanctum" role="menuitem">
              <span class="swatch" style="background:linear-gradient(90deg,#6f4cff,#d6b33b);"></span>
              <span class="tname">Magical Sanctum</span>
            </button>
            <button class="theme-item" data-theme="wublin-island" role="menuitem">
              <span class="swatch" style="background:linear-gradient(90deg,#ff2d95,#08f7fe);"></span>
              <span class="tname">Wublin Island</span>
            </button>
            <button class="theme-item" data-theme="ethereal-island" role="menuitem">
              <span class="swatch" style="background:linear-gradient(90deg,#b54bff,#00e5ff);"></span>
              <span class="tname">Ethereal Island</span>
            </button>
            <button class="theme-item" data-theme="plasma-islet" role="menuitem">
              <span class="swatch" style="background:linear-gradient(90deg,#ff2d9c,#ff6ea6);"></span>
              <span class="tname">Plasma Islet</span>
            </button>
            <button class="theme-item" data-theme="mech-islet" role="menuitem">
              <span class="swatch" style="background:linear-gradient(90deg,#f7d547,#9aa3ab);"></span>
              <span class="tname">Mech Islet</span>
            </button>
            <button class="theme-item" data-theme="shadow-islet" role="menuitem">
              <span class="swatch" style="background:linear-gradient(90deg,#7b6cff,#6b5a7a);"></span>
              <span class="tname">Shadow Islet</span>
            </button>
            <button class="theme-item" data-theme="crystal-islet" role="menuitem">
              <span class="swatch" style="background:linear-gradient(90deg,#00d29b,#58e0b0);"></span>
              <span class="tname">Crystal Islet</span>
            </button>
          </div>
        </div>
    </div>
    
    <div class="input-group">
        <label for="foodX">Food per Click (X)</label>
        <input type="number" id="foodX" value="22" min="0" aria-describedby="foodXHelp">
        <div class="small" id="foodXHelp">Amount of food gained per single click.</div>
    </div>

    <!-- Current level slider (1-19) -->
    <div class="input-group">
        <label for="currentLevel">Current Level (1–19)</label>
        <div class="range-container">
            <input type="range" id="currentLevel" min="1" max="19" value="1" oninput="updateCurrentText(this.value)" aria-valuemin="1" aria-valuemax="19" aria-valuenow="1">
            <span id="currentValue">1</span>
        </div>
        <div class="small">The level the pet is currently at.</div>
    </div>

    <!-- Target level slider (2-20) -->
    <div class="input-group">
        <label for="targetLevel">Target Level (2–20)</label>
        <div class="range-container">
            <input type="range" id="targetLevel" min="2" max="20" value="2" oninput="updateTargetText(this.value)" aria-valuemin="2" aria-valuemax="20" aria-valuenow="2">
            <span id="targetValue">2</span>
        </div>
        <div class="small">Desired level (must be at least 1 higher than Current Level).</div>
    </div>

    <div class="input-group">
        <label for="clicksFed">Clicks Fed Already on Current Level (0–3)</label>
        <div class="range-container">
            <input type="range" id="clicksFed" min="0" max="3" value="0" oninput="updateClicksText(this.value)" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0">
            <span id="clicksValue">0</span>
        </div>
    </div>

    <button id="calculateBtn">Calculate Total</button>

    <div class="result" id="resultDisplay" role="status" aria-live="polite">
        <span class="label">Total Treats:</span>
        <span class="value" id="resultValue">4,685,736</span>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
